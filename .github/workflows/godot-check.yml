name: Godot build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JSON data and release-pass GDScript
        run: |
          python3 -c "import json; from pathlib import Path
          for p in Path('godot/data').glob('*.json'):
              json.loads(p.read_text())"
          python3 scripts/check_gd.py

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          path: godot-engine

      - name: Import project resources (required before any headless boot -- images/etc. need a Godot import pass, unlike scripts)
        run: godot --headless --path godot --import

      - name: Boot autoloads and verify they resolve (also catches compile/parse errors in any autoload script)
        run: |
          # Note: `--check-only --script` compiles a script in total isolation and
          # never boots the autoload registry, so it always misreports cross-autoload
          # references (e.g. Stress.gd using GameState) as undefined, regardless of
          # whether autoloads are registered. Running the real engine main loop via
          # `-s` boots autoloads first, so this is the correct way to check both
          # compile errors and autoload resolution in one pass.
          set -o pipefail
          godot --headless --path godot -s res://tools/ci_autoload_check.gd 2>&1 | tee boot.log
          status=$?
          if grep -qE "SCRIPT ERROR|Autoload missing|Autoload check FAILED" boot.log; then
            status=1
          fi
          exit $status

      - name: Boot the main scene headless (catches scene/script errors on load)
        run: |
          set -o pipefail
          godot --headless --path godot --quit 2>&1 | tee scene.log
          status=$?
          if grep -qE "SCRIPT ERROR|ERROR:|Failed to load" scene.log; then
            status=1
          fi
          exit $status

      - name: Boot every other scene headless (main-scene boot alone misses parse/load errors in scenes only reached via gameplay transitions)
        run: |
          set -o pipefail
          status=0
          for scene in godot/scenes/*.tscn; do
            res="res://scenes/$(basename "$scene")"
            echo "--- Booting $res"
            godot --headless --path godot "$res" --quit 2>&1 | tee -a scenes.log || status=1
          done
          if grep -qE "SCRIPT ERROR|ERROR:|Failed to load" scenes.log; then
            status=1
          fi
          exit $status

  android-build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK (for keytool)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Godot (with export templates)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          path: godot-engine
          include-templates: true

      - name: Generate the debug keystore (matches export_presets.cfg's res://debug.keystore)
        run: |
          keytool -genkeypair -v \
            -keystore godot/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Point Godot at the CI Android SDK
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Export debug APK
        run: |
          mkdir -p godot/build
          # --install-android-build-template alone never quits (no --quit/--export
          # flag makes it boot into the idle main loop and hang forever headless),
          # so it must run in the same invocation as the export that follows it.
          godot --headless --path godot --install-android-build-template --export-debug "Android Debug" build/crxcibl3-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: crxcibl3-debug-apk
          path: godot/build/crxcibl3-debug.apk
          if-no-files-found: error

  # The `secrets` context is not allowed in a job-level `if:` (GitHub Actions
  # rejects the whole workflow file at parse time if it is), so signing-secret
  # presence is checked in a step's `env:` here and passed to android-play-store
  # via a job output instead.
  signing_secrets_check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      has_signing_secrets: ${{ steps.check.outputs.has_signing_secrets }}
    steps:
      - id: check
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" ]]; then
            echo "has_signing_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing_secrets=false" >> "$GITHUB_OUTPUT"
          fi

  # Optional Play Store release AAB — trigger manually via workflow_dispatch.
  # Requires GitHub Actions secrets (Repository → Settings → Secrets and variables → Actions):
  #   ANDROID_KEYSTORE_BASE64  — base64-encoded release .keystore / .jks file
  #   ANDROID_KEYSTORE_PASSWORD — keystore store + key password
  #   ANDROID_KEY_ALIAS        — signing key alias inside the keystore
  android-play-store:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.signing_secrets_check.outputs.has_signing_secrets == 'true'
    needs: [check, signing_secrets_check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK (for keytool / Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Godot (with export templates)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          path: godot-engine
          include-templates: true

      - name: Generate Play Store launcher icons
        run: python3 scripts/generate_play_store_icons.py

      - name: Import project resources
        run: godot --headless --path godot --import

      - name: Install release keystore from secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > godot/release.keystore

      - name: Point Godot at the CI Android SDK
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Export Play Store release AAB
        env:
          CRXCIBL3_KEYSTORE_PATH: godot/release.keystore
          CRXCIBL3_KEYSTORE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          CRXCIBL3_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: scripts/export_android_play_store.sh

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: crxcibl3-release-aab
          path: godot/build/crxcibl3-release.aab
          if-no-files-found: error

  playtest-apk:
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK (for keytool)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Godot (with export templates)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          path: godot-engine
          include-templates: true

      - name: Generate the debug keystore (matches export_presets.cfg's res://debug.keystore)
        run: |
          keytool -genkeypair -v \
            -keystore godot/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Point Godot at the CI Android SDK
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Import project resources
        run: godot --headless --path godot --import

      - name: Export playtest debug APK
        run: |
          mkdir -p godot/build
          # --install-android-build-template alone never quits (no --quit/--export
          # flag makes it boot into the idle main loop and hang forever headless),
          # so it must run in the same invocation as the export that follows it.
          godot --headless --path godot --install-android-build-template --export-debug "Android Debug" build/crxcibl3-debug.apk
          cp -f godot/build/crxcibl3-debug.apk godot/build/crxcibl3-playtest.apk
          sha256sum godot/build/crxcibl3-playtest.apk
          wc -c < godot/build/crxcibl3-playtest.apk

      - name: Upload playtest APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: crxcibl3-playtest-apk
          path: godot/build/crxcibl3-playtest.apk
          if-no-files-found: error
