name: Godot build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false

      - name: Boot autoloads and verify they resolve (also catches compile/parse errors in any autoload script)
        run: |
          # Note: `--check-only --script` compiles a script in total isolation and
          # never boots the autoload registry, so it always misreports cross-autoload
          # references (e.g. Stress.gd using GameState) as undefined, regardless of
          # whether autoloads are registered. Running the real engine main loop via
          # `-s` boots autoloads first, so this is the correct way to check both
          # compile errors and autoload resolution in one pass.
          set -o pipefail
          godot --headless --path godot -s res://tools/ci_autoload_check.gd 2>&1 | tee boot.log
          status=$?
          if grep -qE "SCRIPT ERROR|Autoload missing|Autoload check FAILED" boot.log; then
            status=1
          fi
          exit $status
